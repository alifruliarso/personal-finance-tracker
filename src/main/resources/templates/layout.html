<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">[[#{app.title}]]</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link th:href="@{/css/app.css}" rel="stylesheet" />
    <style>
        .sidebar .nav-link.active,
        .sidebar .nav-link:active {
            background: #4fc9da !important;
            color: #fff !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2" crossorigin="anonymous"></script>
</head>


<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar d-flex flex-column flex-shrink-0 p-3"
            style="width: 240px; min-height: 100vh; background: #F8F6F2;">
            <a th:href="@{/}" class="navbar-brand mb-4 d-flex align-items-center text-dark">
                <img th:src="@{/images/layered-steps-haikei.svg}" width="85" height="32" class="me-2" />
            </a>
            <div class="separator d-none d-lg-block"></div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link text-dark">[[#{navigation.home}]]</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/categories}" class="nav-link text-dark">[[#{category.list.headline}]]</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/transactions}" class="nav-link text-dark">[[#{transaction.list.headline}]]</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/dashboard}" class="nav-link text-dark">Dashboard</a>
                </li>
            </ul>
        </nav>
        <!-- Main content area -->
        <div class="flex-grow-1">
            <!-- Header -->
            <header class="bg-white border-bottom shadow-sm py-3 px-4 mb-4">
                <div class="container-fluid">
                    <span class="fw-bold fs-3">[[#{app.title}]]</span>
                </div>
            </header>
            <main class="container-fluid px-4">
                <p th:if="${MSG_SUCCESS}" class="alert alert-success" role="alert">[[${MSG_SUCCESS}]]</p>
                <p th:if="${MSG_INFO}" class="alert alert-info" role="alert">[[${MSG_INFO}]]</p>
                <p th:if="${MSG_ERROR}" class="alert alert-danger" role="alert">[[${MSG_ERROR}]]</p>
                <div layout:fragment="content"></div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
